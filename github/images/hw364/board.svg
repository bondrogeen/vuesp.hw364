<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none" font-family="Inter, Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05081f"/>
      <stop offset="1" stop-color="#07112c"/>
    </linearGradient>
    <linearGradient id="board" x1="200" y1="90" x2="1000" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1b42"/>
      <stop offset="1" stop-color="#08122e"/>
    </linearGradient>
    <linearGradient id="screen" x1="620" y1="150" x2="940" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#031a1a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#94a3b8" stroke-width="1">
    <path d="M0 80h1200M0 160h1200M0 240h1200M0 320h1200M0 400h1200M0 480h1200M0 560h1200M0 640h1200M0 720h1200"/>
    <path d="M80 0v760M160 0v760M240 0v760M320 0v760M400 0v760M480 0v760M560 0v760M640 0v760M720 0v760M800 0v760M880 0v760M960 0v760M1040 0v760M1120 0v760"/>
  </g>

  <text x="80" y="72" fill="#6ee7b7" font-size="15" font-weight="700" letter-spacing="3">VUESP · HW-364</text>
  <text x="80" y="122" fill="#ffffff" font-size="42" font-weight="800">HW-364A / HW-364B</text>
  <text x="80" y="158" fill="#94a3b8" font-size="18">NodeMCU ESP8266 с распаянным OLED 0.96″</text>

  <g>
    <rect x="200" y="200" width="800" height="430" rx="34" fill="url(#board)" stroke="#1e3a6e" stroke-width="3"/>
    <rect x="222" y="222" width="756" height="386" rx="24" fill="none" stroke="#1e3a6e" stroke-width="1" stroke-dasharray="8 8" opacity="0.7"/>

    <!-- USB -->
    <rect x="520" y="604" width="160" height="38" rx="12" fill="#111827" stroke="#4b5563" stroke-width="2"/>
    <rect x="548" y="614" width="104" height="18" rx="9" fill="#0f172a" stroke="#6b7280" stroke-width="1.5"/>
    <text x="600" y="628" text-anchor="middle" fill="#cbd5e1" font-size="9" font-weight="700" letter-spacing="1">USB-C / micro-USB</text>

    <!-- ESP8266 module -->
    <rect x="262" y="260" width="300" height="230" rx="18" fill="#111827" stroke="#374151" stroke-width="2"/>
    <path d="M290 300h12v-20h12v20h12v-20h12v20h12v-20h12v20h12v-20h12v20h12v-20h12v20h12v-20h12v20h12v-20h12v20h12" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round"/>
    <rect x="292" y="330" width="240" height="120" rx="10" fill="#0b1220" stroke="#1f2937" stroke-width="2"/>
    <text x="412" y="372" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">ESP8266</text>
    <text x="412" y="400" text-anchor="middle" fill="#94a3b8" font-size="14">Tensilica LX106 · Wi-Fi 2.4 ГГц</text>
    <text x="412" y="424" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700" letter-spacing="1">NodeMCU</text>

    <!-- OLED -->
    <rect x="620" y="260" width="330" height="230" rx="18" fill="#0b1220" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <rect x="646" y="286" width="278" height="150" rx="8" fill="url(#screen)" stroke="#134e4a" stroke-width="2"/>
    <text x="664" y="324" fill="#6ee7b7" font-size="18" font-weight="800">HW-364</text>
    <text x="664" y="352" fill="#e2e8f0" font-size="14">SSD1306 128×64</text>
    <text x="664" y="378" fill="#94a3b8" font-size="12">SDA D6 / GPIO14</text>
    <text x="664" y="398" fill="#94a3b8" font-size="12">SCL D5 / GPIO12</text>
    <text x="664" y="420" fill="#10b981" font-size="12" font-weight="700">I2C 0x3C</text>
    <text x="785" y="464" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700" letter-spacing="2">0.96″ OLED</text>

    <!-- pin headers -->
    <g fill="#d4a72c">
      <rect x="222" y="250" width="18" height="10" rx="2"/><rect x="222" y="280" width="18" height="10" rx="2"/>
      <rect x="222" y="310" width="18" height="10" rx="2"/><rect x="222" y="340" width="18" height="10" rx="2"/>
      <rect x="222" y="370" width="18" height="10" rx="2"/><rect x="222" y="400" width="18" height="10" rx="2"/>
      <rect x="222" y="430" width="18" height="10" rx="2"/><rect x="222" y="460" width="18" height="10" rx="2"/>
      <rect x="960" y="250" width="18" height="10" rx="2"/><rect x="960" y="280" width="18" height="10" rx="2"/>
      <rect x="960" y="310" width="18" height="10" rx="2"/><rect x="960" y="340" width="18" height="10" rx="2"/>
      <rect x="960" y="370" width="18" height="10" rx="2"/><rect x="960" y="400" width="18" height="10" rx="2"/>
      <rect x="960" y="430" width="18" height="10" rx="2"/><rect x="960" y="460" width="18" height="10" rx="2"/>
    </g>

    <text x="600" y="536" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="700">ESP8266 + OLED на одной плате</text>
    <text x="600" y="562" text-anchor="middle" fill="#94a3b8" font-size="13">Не требует внешней проводки дисплея</text>
  </g>

  <g font-size="13" fill="#cbd5e1">
    <circle cx="80" cy="680" r="5" fill="#10b981"/>
    <text x="96" y="685">3.3 В логика</text>
    <circle cx="250" cy="680" r="5" fill="#28b7f0"/>
    <text x="266" y="685">I2C 0x3C</text>
    <circle cx="400" cy="680" r="5" fill="#f59e0b"/>
    <text x="416" y="685">USB-C / micro-USB</text>
    <circle cx="620" cy="680" r="5" fill="#a78bfa"/>
    <text x="636" y="685">LittleFS + OTA</text>
  </g>
</svg>
